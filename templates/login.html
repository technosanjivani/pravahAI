<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PravahAI Login</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    :root{
        --ink:#10182b;
        --muted:#6b7688;
        --faint:#a6afbd;
        --paper:#f5f7fb;
        --card:#ffffff;
        --line:rgba(16,24,43,.08);
        --accent-1:#155eef;
        --accent-2:#00b8d9;
        --error:#c0392b;
        --shadow-sm:0 1px 2px rgba(16,24,40,.04);
        --shadow-lg:0 24px 48px -16px rgba(16,24,40,.16);
        --ease:cubic-bezier(.22,1,.36,1);
    }

    *{box-sizing:border-box;}

    body{
        margin:0;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:
            radial-gradient(circle at 15% 10%, rgba(21,94,239,.05), transparent 40%),
            radial-gradient(circle at 85% 90%, rgba(0,184,217,.06), transparent 45%),
            var(--paper);
        font-family:'Manrope',sans-serif;
        color:var(--ink);
        padding:24px;
    }

    .auth-card{
        position:relative;
        width:420px;
        max-width:100%;
        background:var(--card);
        border:1px solid var(--line);
        border-radius:20px;
        padding:44px 40px 38px;
        box-shadow:var(--shadow-sm), var(--shadow-lg);
        opacity:0;
        transform:translateY(18px);
        animation:card-in .7s var(--ease) .05s forwards;
        overflow:hidden;
    }

    /* signature flow line — the "Pravah" (flow) mark */
    .flow-mark{
        display:block;
        width:100%;
        height:34px;
        margin-bottom:18px;
        overflow:visible;
    }

    .flow-path{
        fill:none;
        stroke:url(#flowGradient);
        stroke-width:2.5;
        stroke-linecap:round;
        stroke-dasharray:340;
        stroke-dashoffset:340;
        animation:draw-flow 1.3s var(--ease) .25s forwards,
                   shimmer-flow 3.2s linear 1.6s infinite;
    }

    .auth-title{
        font-family:'Fraunces',serif;
        font-size:32px;
        font-weight:600;
        letter-spacing:-.01em;
        margin:0 0 6px;
        opacity:0;
        animation:fade-up .6s var(--ease) .45s forwards;
    }

    .auth-sub{
        color:var(--muted);
        font-size:14.5px;
        margin:0 0 30px;
        opacity:0;
        animation:fade-up .6s var(--ease) .55s forwards;
    }

    .flash-msg{
        display:flex;
        align-items:center;
        gap:8px;
        color:var(--error);
        background:rgba(192,57,43,.06);
        border:1px solid rgba(192,57,43,.15);
        padding:10px 14px;
        border-radius:10px;
        font-size:13.5px;
        margin-bottom:20px;
        opacity:0;
        animation:fade-up .5s var(--ease) .1s forwards;
    }

    form{
        opacity:0;
        animation:fade-up .6s var(--ease) .65s forwards;
    }

    .form-group{
        position:relative;
        margin-bottom:22px;
    }

    .form-control{
        width:100%;
        background:var(--paper);
        border:1.5px solid var(--line);
        color:var(--ink);
        font-family:'Manrope',sans-serif;
        font-size:15px;
        padding:16px 16px 8px 44px;
        border-radius:12px;
        outline:none;
        transition:border-color .25s var(--ease), box-shadow .25s var(--ease), background .25s var(--ease);
    }

    .form-control::placeholder{ color:transparent; }

    .form-group label{
        position:absolute;
        left:44px;
        top:15px;
        font-size:15px;
        color:var(--faint);
        pointer-events:none;
        transition:transform .2s var(--ease), font-size .2s var(--ease), color .2s var(--ease), top .2s var(--ease);
    }

    .form-group .icon{
        position:absolute;
        left:15px;
        top:15px;
        width:18px;
        height:18px;
        stroke:var(--faint);
        transition:stroke .25s var(--ease);
        pointer-events:none;
    }

    .form-control:hover{
        border-color:rgba(16,24,43,.16);
    }

    .form-control:focus{
        border-color:var(--accent-1);
        background:#fff;
        box-shadow:0 0 0 4px rgba(21,94,239,.09);
    }

    .form-control:focus ~ .icon,
    .form-control:not(:placeholder-shown) ~ .icon{
        stroke:var(--accent-1);
    }

    .form-control:focus ~ label,
    .form-control:not(:placeholder-shown) ~ label{
        top:7px;
        font-size:11px;
        font-weight:600;
        letter-spacing:.02em;
        color:var(--accent-1);
    }

    .btn-auth{
        position:relative;
        width:100%;
        color:#fff;
        background:linear-gradient(120deg, var(--accent-1), var(--accent-2));
        border:none;
        padding:15px;
        border-radius:12px;
        font-family:'Manrope',sans-serif;
        font-size:15px;
        font-weight:700;
        letter-spacing:.01em;
        cursor:pointer;
        margin-top:6px;
        overflow:hidden;
        transition:transform .15s var(--ease), box-shadow .25s var(--ease);
        box-shadow:0 8px 20px -8px rgba(21,94,239,.55);
    }

    .btn-auth::after{
        content:"";
        position:absolute;
        top:0; left:-60%;
        width:40%; height:100%;
        background:linear-gradient(120deg, transparent, rgba(255,255,255,.35), transparent);
        transform:skewX(-20deg);
        transition:left .55s var(--ease);
    }

    .btn-auth:hover{
        transform:translateY(-2px);
        box-shadow:0 12px 26px -8px rgba(21,94,239,.62);
    }

    .btn-auth:hover::after{ left:130%; }

    .btn-auth:active{
        transform:translateY(0) scale(.98);
    }

    .btn-auth:focus-visible,
    .form-control:focus-visible{
        outline:2px solid var(--accent-1);
        outline-offset:2px;
    }

    .bottom-link{
        text-align:center;
        margin-top:26px;
        font-size:14px;
        color:var(--muted);
        opacity:0;
        animation:fade-up .6s var(--ease) .75s forwards;
    }

    .bottom-link a{
        position:relative;
        color:var(--accent-1);
        text-decoration:none;
        font-weight:600;
        margin-left:2px;
    }

    .bottom-link a::after{
        content:"";
        position:absolute;
        left:0; bottom:-2px;
        width:100%; height:1.5px;
        background:var(--accent-1);
        transform:scaleX(0);
        transform-origin:left;
        transition:transform .25s var(--ease);
    }

    .bottom-link a:hover::after{ transform:scaleX(1); }

    @keyframes card-in{
        to{ opacity:1; transform:translateY(0); }
    }

    @keyframes fade-up{
        from{ opacity:0; transform:translateY(8px); }
        to{ opacity:1; transform:translateY(0); }
    }

    @keyframes draw-flow{
        to{ stroke-dashoffset:0; }
    }

    @keyframes shimmer-flow{
        0%{ stroke-dashoffset:0; }
        100%{ stroke-dashoffset:-680; }
    }

    @media (prefers-reduced-motion: reduce){
        *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    }

    @media (max-width:480px){
        .auth-card{ padding:34px 24px 30px; border-radius:16px; }
        .auth-title{ font-size:27px; }
    }
</style>
</head>
<body>

<div class="auth-card">

    <svg class="flow-mark" viewBox="0 0 360 34" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
            <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#155eef"/>
                <stop offset="50%" stop-color="#00b8d9"/>
                <stop offset="100%" stop-color="#155eef"/>
            </linearGradient>
        </defs>
        <path class="flow-path" d="M2 24 C 40 4, 70 4, 100 18 S 160 32, 190 16 S 250 2, 280 16 S 330 30, 358 12"/>
    </svg>

    <h1 class="auth-title">Pravah<span style="font-style:italic;font-weight:500;">AI</span></h1>
    <p class="auth-sub">Sign in to your account</p>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
        <div class="flash-msg">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            {{ messages[0] }}
        </div>
    {% endif %}
    {% endwith %}

    <form method="POST">

        <div class="form-group">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input
                type="text"
                id="username"
                name="username"
                class="form-control"
                placeholder=" "
                required>
            <label for="username">Username</label>
        </div>

        <div class="form-group">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                placeholder=" "
                required>
            <label for="password">Password</label>
        </div>

        <button class="btn-auth" type="submit">
            Sign In
        </button>

    </form>

    <div class="bottom-link">
        Don't have an account?
        <a href="/signup">Create Account</a>
    </div>

</div>

</body>
</html>
